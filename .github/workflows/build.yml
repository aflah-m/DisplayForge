name: Build Launcher

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Compile Configure.exe
        run: cl /O2 /DUNICODE /D_UNICODE configure_app.c user32.lib comdlg32.lib ole32.lib gdi32.lib /Fe:Configure.exe

      - name: Compile Launcher.exe
        run: cl /O2 /DUNICODE /D_UNICODE launcher_app.c user32.lib shell32.lib gdi32.lib /Fe:Launcher.exe

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: game-launcher-build
          path: |
            Configure.exe
            Launcher.exe
